name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Resolve version
        id: version
        run: |
          version="v$(node scripts/version.mjs)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version). Run npm run bump first." >&2
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      # No Apple signing: Tauri ad-hoc signs the app, which Apple Silicon needs to launch it.
      # The updater key signs the update bundle, and tauri-action uploads latest.json for it.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target aarch64-apple-darwin --bundles app,dmg
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: ProxaLens ${{ steps.version.outputs.tag }}
          releaseBody: |
            Apple Silicon only. The app is unsigned, so after copying it to Applications run:

            ```
            xattr -dr com.apple.quarantine /Applications/ProxaLens.app
            ```
          releaseDraft: true
          prerelease: false
