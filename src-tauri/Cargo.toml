[package]
name = "proxalens"
version = "0.4.0"
description = "Free Proxyman-style HTTP/HTTPS debugging proxy"
authors = ["Naufal Zhafran"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "proxalens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
hudsucker = { version = "0.25.0", features = ["http2"] }
tokio = { version = "1.53.2", features = ["full"] }
parking_lot = "0.12.5"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
http-body-util = "0.1.5"
bytes = "1.12.1"
libc = "0.2.190"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "tls12", "logging"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
rustls-native-certs = "0.8.4"
webpki-roots = "1.0.9"
sha1_smol = "1.0.1"
base64 = "0.23.1"
tauri-plugin-clipboard-manager = "2"
flate2 = "1"
brotli = "8"
zstd = "0.13"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
regex = "1"
libproc = "0.14.11"
tower-service = "0.3"
tauri-plugin-updater = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tokio-rustls = "0.26"
