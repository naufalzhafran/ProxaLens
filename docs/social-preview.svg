<!-- ProxaLens GitHub social preview, 1280x640. Render: rsvg-convert docs/social-preview.svg -o docs/social-preview.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b7466"/>
      <stop offset="1" stop-color="#063f38"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="48" cy="48" r="30"/></clipPath>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1120" cy="120" r="360" fill="#ffffff" opacity="0.05"/>
  <circle cx="1120" cy="120" r="230" fill="#ffffff" opacity="0.05"/>

  <!-- logo mark -->
  <g transform="translate(96 120) scale(2.2)">
    <rect width="96" height="96" rx="22" fill="#ffffff"/>
    <circle cx="48" cy="48" r="30" fill="#0b7466" opacity="0.15"/>
    <g clip-path="url(#lens)" fill="#0b7466">
      <rect x="22" y="32" width="24" height="8" rx="4"/>
      <rect x="34" y="44" width="34" height="8" rx="4"/>
      <rect x="46" y="56" width="26" height="8" rx="4"/>
    </g>
    <circle cx="48" cy="48" r="30" fill="none" stroke="#0b7466" stroke-width="5"/>
  </g>

  <text x="96" y="440" fill="#ffffff" font-size="104" font-weight="700" letter-spacing="-2">ProxaLens</text>
  <text x="100" y="505" fill="#ffffff" opacity="0.85" font-size="36">A free HTTP/HTTPS debugging proxy for macOS</text>

  <!-- request waterfall -->
  <g fill="#ffffff">
    <rect x="720" y="190" width="200" height="30" rx="15" opacity="0.95"/>
    <rect x="800" y="250" width="300" height="30" rx="15" opacity="0.75"/>
    <rect x="880" y="310" width="220" height="30" rx="15" opacity="0.55"/>
    <rect x="760" y="370" width="260" height="30" rx="15" opacity="0.4"/>
  </g>
  <text x="720" y="450" fill="#ffffff" opacity="0.7" font-size="26">Inspect · Rewrite · Breakpoint · Script</text>
</svg>
